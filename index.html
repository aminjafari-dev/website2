<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Byto.tech combines AI-powered development, professional engineering, and cybersecurity to build fast, scalable, secure digital products."
    />
    <title>Byto.tech — Secure AI-Powered Development</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="stage">
      <section class="hero" aria-labelledby="hero-title">
        <header class="nav">
          <a class="brand" href="#" aria-label="Byto.tech home">
            <span class="brand-mark" aria-hidden="true">B</span>
            <span>Byto.tech</span>
          </a>
          <a class="waitlist" href="mailto:hello@byto.tech">Contact</a>
        </header>

        <div class="ambient ambient-one" aria-hidden="true"></div>
        <div class="ambient ambient-two" aria-hidden="true"></div>
        <div class="circuit-grid" aria-hidden="true"></div>
        <div class="outline-card" aria-hidden="true"></div>
        <div class="speed-lines" aria-hidden="true">
          <i></i><i></i><i></i><i></i><i></i>
        </div>

        <div class="card-scene portfolio-scene" aria-hidden="true">
          <div class="website-stack">
            <figure class="website-shot website-house">
              <span class="browser-bar"><i></i><i></i><i></i></span>
              <img
                src="assets/website/Screenshot_2026-08-05_at_9.21.00_pm.png_202608052128.jpeg"
                alt=""
              />
            </figure>
            <figure class="website-shot website-tennis">
              <span class="browser-bar"><i></i><i></i><i></i></span>
              <img
                src="assets/website/Screenshot_2026-08-05_at_9.22.42_pm.png_202608052130.jpeg"
                alt=""
              />
            </figure>
            <figure class="website-shot website-studio">
              <span class="browser-bar"><i></i><i></i><i></i></span>
              <img
                src="assets/website/Screenshot_2026-08-05_at_9.23.11_pm.png_202608052129.jpeg"
                alt=""
              />
            </figure>
            <figure class="website-shot website-audio">
              <span class="browser-bar"><i></i><i></i><i></i></span>
              <img
                src="assets/website/Screenshot_2026-08-05_at_9.24.02_pm.png_202608052130.jpeg"
                alt=""
              />
            </figure>
          </div>

          <div class="phone-stack">
          <img
            class="phone-shot shot-health"
              src="assets/app/Place_UI_into_iPhone_mockup_202608052024-Photoroom.png"
            alt=""
          />
          <img
            class="phone-shot shot-fitness"
              src="assets/app/Place_UI_into_iPhone_mockup_202608052024%20(1)-Photoroom.png"
            alt=""
          />
          <img
            class="phone-shot shot-finance"
              src="assets/app/Place_UI_into_iPhone_mockup_202608052024%20(2)-Photoroom.png"
            alt=""
          />
          </div>
        </div>

        <div class="hero-copy">
          <h1 id="hero-title">
            <span class="line-mask">
              <span class="headline-line">AI Builds Faster.</span>
            </span>
            <span class="line-mask second-line">
              <strong class="headline-line">We Make It Secure<span class="accent-dot">.</span></strong>
            </span>
          </h1>

          <p class="hero-subtitle reveal-up">
            At Byto.tech, we combine AI-powered development with professional
            engineering and cybersecurity practices to deliver fast, scalable,
            and secure digital products.
          </p>

          <div class="hero-actions reveal-up">
            <a class="button button-primary" href="mailto:hello@byto.tech">
              Start Your Project
              <span aria-hidden="true">↗</span>
            </a>
            <a class="button button-secondary" href="#work">
              View Our Work
              <span aria-hidden="true">→</span>
            </a>
          </div>
        </div>

      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
