<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A new generation of customizable digital wallets."
    />
    <title>Byto.tech — Secure AI-Powered Development</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="stage">
      <section class="hero" aria-labelledby="hero-title">
        <header class="nav">
          <a class="brand" href="#" aria-label="Byto.tech home">
            <span class="brand-mark" aria-hidden="true">B</span>
            <span>Byto.tech</span>
          </a>
          <a class="waitlist" href="mailto:hello@byto.tech">Contact</a>
        </header>

        <div class="ambient ambient-one" aria-hidden="true"></div>
        <div class="ambient ambient-two" aria-hidden="true"></div>
        <div class="circuit-grid" aria-hidden="true"></div>
        <div class="outline-card" aria-hidden="true"></div>
        <div class="speed-lines" aria-hidden="true">
          <i></i><i></i><i></i><i></i><i></i>
        </div>

        <div class="card-scene phone-scene" aria-hidden="true">
          <img
            class="phone-shot shot-health"
            src="assets/Place_UI_into_iPhone_mockup_202608052024-Photoroom.png"
            alt=""
          />
          <img
            class="phone-shot shot-fitness"
            src="assets/Place_UI_into_iPhone_mockup_202608052024%20(1)-Photoroom.png"
            alt=""
          />
          <img
            class="phone-shot shot-finance"
            src="assets/Place_UI_into_iPhone_mockup_202608052024%20(2)-Photoroom.png"
            alt=""
          />
          <img
            class="phone-shot shot-swap"
            src="assets/Place_UI_into_iPhone_mockup_202608052023-Photoroom.png"
            alt=""
          />
          <img
            class="phone-shot shot-report"
            src="assets/Place_UI_into_iPhone_mockup_202608052020-Photoroom.png"
            alt=""
          />
        </div>

        <div class="hero-copy">
          <h1 id="hero-title">
            <span class="line-mask">
              <span class="headline-line">AI Builds Faster.</span>
            </span>
            <span class="line-mask second-line">
              <strong class="headline-line">We Make It Secure<span class="accent-dot">.</span></strong>
            </span>
          </h1>

          <p class="hero-subtitle reveal-up">
            At Byto.tech, we combine AI-powered development with professional
            engineering and cybersecurity practices to deliver fast, scalable,
            and secure digital products.
          </p>

          <div class="hero-actions reveal-up">
            <a class="button button-primary" href="mailto:hello@byto.tech">
              Start Your Project
              <span aria-hidden="true">↗</span>
            </a>
            <a class="button button-secondary" href="#work">
              View Our Work
              <span aria-hidden="true">→</span>
            </a>
          </div>
        </div>

        <img
          class="foreground-card foreground-phone"
          src="assets/Place_UI_into_iPhone_mockup_202608052025-Photoroom.png"
          alt=""
          aria-hidden="true"
        />
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
