<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A new generation of customizable digital wallets."
    />
    <title>Swapie — Next generation wallets</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="stage">
      <section class="hero" aria-labelledby="hero-title">
        <header class="nav">
          <a class="brand" href="#" aria-label="Swapie home">
            <span class="brand-mark" aria-hidden="true">∞</span>
            <span>swapie</span>
          </a>
          <a class="waitlist" href="#waitlist">Waitlist</a>
        </header>

        <div class="ambient ambient-one" aria-hidden="true"></div>
        <div class="ambient ambient-two" aria-hidden="true"></div>
        <div class="outline-card" aria-hidden="true"></div>
        <div class="speed-lines" aria-hidden="true">
          <i></i><i></i><i></i><i></i><i></i>
        </div>

        <div class="card-scene" aria-hidden="true">
          <article class="wallet-card card-back">
            <div class="back-grid"></div>
            <div class="pearl pearl-a"></div>
            <div class="pearl pearl-b"></div>
            <span class="card-owner">Archie's</span>
            <span class="card-kind">Wallet</span>
            <strong class="card-number">763</strong>
          </article>

          <article class="wallet-card card-purple">
            <span class="mini-label">CUSTOM<br />DESIGN</span>
            <div class="orb orb-one"></div>
            <div class="orb orb-two"></div>
            <div class="orb orb-three"></div>
            <div class="purple-wave"></div>
          </article>

          <article class="wallet-card card-white">
            <span class="vertical-name">Nathan's</span>
            <span class="vertical-kind">Wallet</span>
            <span class="digits">4090<br /><b>2470</b></span>
            <span class="date">09/09</span>
            <div class="soft-sphere"></div>
          </article>

          <article class="wallet-card card-color">
            <div class="contactless">)))</div>
            <div class="color-block block-one"></div>
            <div class="color-block block-two"></div>
            <div class="color-block block-three"></div>
            <div class="color-block block-four"></div>
            <div class="color-notch"></div>
          </article>

          <article class="wallet-card card-blue">
            <div class="blue-plane plane-one"></div>
            <div class="blue-plane plane-two"></div>
            <div class="blue-plane plane-three"></div>
            <span>SWP</span>
          </article>
        </div>

        <div class="hero-copy">
          <div class="eyebrow reveal-up">
            <span class="spark" aria-hidden="true">✳</span>
            <span class="eyebrow-rule"></span>
            <span>MORE THAN 200 DIFFERENT CARDS</span>
          </div>

          <h1 id="hero-title">
            <span class="line-mask">
              <span class="headline-line">Switch up to</span>
              <span class="pattern-pill" aria-hidden="true"></span>
            </span>
            <span class="line-mask second-line">
              <strong class="headline-line">next generati<span class="asterisk">✳</span>n</strong>
              <span class="headline-line">&nbsp;of wallets.</span>
            </span>
          </h1>
        </div>

        <footer class="features" id="waitlist">
          <a class="down-arrow" href="#waitlist" aria-label="Explore features">
            <span></span>
          </a>
          <div class="feature feature-one">
            <span class="feature-icon cut-corner" aria-hidden="true"></span>
            <span>CUSTOM<br />THINGS</span>
          </div>
          <div class="feature feature-two">
            <span class="feature-icon pinwheel" aria-hidden="true"></span>
            <span>PEOPLE'S<br />FIRST CHOICE</span>
          </div>
          <div class="feature feature-three">
            <span class="feature-icon triangles" aria-hidden="true"></span>
            <span>DIFFERENT<br />VARIETIES</span>
          </div>
        </footer>

        <div class="foreground-card" aria-hidden="true">
          <span class="foreground-dots">• • • •</span>
          <div class="fg-grid"></div>
          <div class="fg-red"></div>
          <div class="fg-blue"></div>
          <div class="fg-pink"></div>
          <div class="fg-fold"></div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
